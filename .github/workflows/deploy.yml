name: 🚀 Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 🧰 Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'          # Atualizado para evitar o aviso de Node.js obsoleto
        cache: 'npm'

    - name: 🔨 Install Dependencies
      run: npm ci

    - name: ✨ Build Project
      run: npm run build

    - name: 📂 Sync Files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: br1064.hostgator.com.br     # IP/Servidor direto da sua hospedagem para evitar o erro de ENOTFOUND
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/
        server-dir: ./
