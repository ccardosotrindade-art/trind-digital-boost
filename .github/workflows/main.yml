name: Deploy to HostGator via FTP

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile || bun install

      - name: Build
        run: bun run build

      - name: Detectar diretório de build
        run: |
          if [ -d "dist/client" ]; then echo "BUILD_DIR=dist/client" >> $GITHUB_ENV
          elif [ -d "dist" ] && [ -f "dist/index.html" ]; then echo "BUILD_DIR=dist" >> $GITHUB_ENV
          elif [ -d "out" ]; then echo "BUILD_DIR=out" >> $GITHUB_ENV
          else echo "ERRO: diretório de build não encontrado (dist/client, dist ou out)" && ls -la && exit 1; fi

      - name: Validar build
        shell: bash
        run: |
          set -o pipefail
          if [ ! -f "$BUILD_DIR/index.html" ]; then
            echo "AVISO: index.html não encontrado em $BUILD_DIR (app SSR - hospedagem estática pode não funcionar)"
          fi
          test -d "$BUILD_DIR/assets" || echo "AVISO: $BUILD_DIR/assets não encontrado"
          echo "Build detectado em: $BUILD_DIR"
          ls -la "$BUILD_DIR"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ${{ env.BUILD_DIR }}/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/*.map
