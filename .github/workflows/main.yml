name: Deploy to HostGator via FTP

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build
        run: bun run build

       - name: Copy .htaccess (SPA fallback)
        run: cp public/.htaccess dist/client/.htaccess

      - name: Validate build static
        shell: bash
        run: |
          set -e
          test -f dist/client/index.html || { echo "ERROR: index.html not found"; exit 1; }
          test -d dist/client/assets || { echo "ERROR: dist/client/assets not found"; exit 1; }
          test -f dist/client/.htaccess || { echo "ERROR: .htaccess not found"; exit 1; }
          echo "Build static OK"
          ls -la dist/client

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: dist/client/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/*.map
            **/_headers
