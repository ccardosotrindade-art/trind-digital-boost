name: Deploy to HostGator via FTP

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile || bun install

      - name: Build
        run: bun run build

      - name: Pré-renderizar HTML estático (SSR -> static)
        shell: bash
        run: |
          set -e
          rm -rf .wrangler
          # Sobe o worker localmente com wrangler dev
          (cd dist/server && bunx --bun wrangler dev --port 8787 --ip 127.0.0.1 > /tmp/wrangler.log 2>&1 &)
          # Aguarda o servidor responder
          READY=0
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8787/ -o /tmp/home.html; then
              READY=1; echo "Servidor pronto em ${i}s"; break
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            echo "ERRO: wrangler não respondeu a tempo"
            tail -60 /tmp/wrangler.log
            exit 1
          fi
          # Salva index.html pré-renderizado
          mv /tmp/home.html dist/client/index.html
          echo "index.html gerado ($(wc -c < dist/client/index.html) bytes)"
          # Encerra o worker
          for pid in $(pgrep -f "wrangler dev" || true); do kill "$pid" 2>/dev/null || true; done

      - name: Copiar .htaccess (SPA fallback)
        run: cp public/.htaccess dist/client/.htaccess

      - name: Validar build estático
        shell: bash
        run: |
          set -e
          test -f dist/client/index.html || { echo "ERRO: index.html não encontrado"; exit 1; }
          test -d dist/client/assets || { echo "ERRO: dist/client/assets não encontrado"; exit 1; }
          test -f dist/client/.htaccess || { echo "ERRO: .htaccess não encontrado"; exit 1; }
          echo "Build estático OK"
          ls -la dist/client

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: dist/client/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/*.map
            **/_headers
