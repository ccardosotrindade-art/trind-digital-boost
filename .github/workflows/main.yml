name: Deploy to HostGator via FTP

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build (SPA estático)
        run: bun run build

      - name: Copy .htaccess (SPA fallback)
        run: cp public/.htaccess dist/.htaccess

      - name: Validate build
        shell: bash
        run: |
          set -e
          test -f dist/index.html || { echo "ERROR: dist/index.html não encontrado"; exit 1; }
          test -d dist/assets     || { echo "ERROR: dist/assets não encontrado"; exit 1; }
          test -f dist/.htaccess  || { echo "ERROR: dist/.htaccess não encontrado"; exit 1; }
          echo "Build OK"
          ls -la dist

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/*.map
